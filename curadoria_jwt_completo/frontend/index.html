<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curadoria JWT</title>
</head>
<body>
    <nav>
        <input type="button" onclick="register()" value="Cadastro">
        <input type="button" onclick="login()" value="Login">
        <input type="button" onclick="items_register()" value="Cadastro Item">
        <input type="button" onclick="listar_itens()" value="Listar Itens">
    </nav>
    
    <div id="div_cadastro_usuario">
        <form id="form_cadastro_usuario">
            <label for="name">Nome</label>
            <input type="next" name="name" id="name">

            <label for="email">E-mail</label>
            <input type="next" name="email" id="email">

            <hr>

            <label for="password">Senha</label>
            <input type="password" name="password" id="password">

            <label for="confirma_password">Confirme a senha</label>
            <input type="password" name="confirma_password" id="confirma_password">
        
            <input type="button" value="Cadastrar" onclick="processa_cadastro_usuario()">
        </form>
    </div>

    <script src="./controle_api.js"></script>
    <script src="./controle_tela.js"></script>
</body>
</html>
